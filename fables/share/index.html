<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <title>Fables — Open in app</title>
  <meta name="description" content="Track what you watch, read, and play with Fables." />

  <!-- ============================================================ -->
  <!-- This file is INTENTIONALLY a duplicate of                    -->
  <!--   /fables/share/index.html                                   -->
  <!-- ============================================================ -->
  <!-- GitHub Pages serves /404.html for any path that doesn't      -->
  <!-- exist as a static file. Deep-link URLs like                  -->
  <!--   /fables/share/title/movies/27205?name=Inception            -->
  <!-- aren't static files (we'd need to generate one per title) -- -->
  <!-- so GH Pages routes them here. The JS below reads             -->
  <!-- window.location and renders the same UI as the landing page. -->
  <!-- The URL bar stays at the original deep-link path; the user   -->
  <!-- doesn't notice the 404.                                      -->
  <!--                                                              -->
  <!-- KEEP IN SYNC with /fables/share/index.html — edit both       -->
  <!-- files together. (We could symlink, but GitHub Pages doesn't  -->
  <!-- preserve symlinks across some build paths, so duplicating is -->
  <!-- the safe move.)                                              -->
  <!-- ============================================================ -->

  <meta property="og:title" content="Fables — track what you watch, read, and play" />
  <meta property="og:description" content="Open this title in Fables." />
  <meta property="og:image" content="https://tryfables.com/img/hero.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0A0A0A;
      --surface: #1a1917;
      --text: #e5e2e1;
      --muted: #d0c5af;
      --gold: #f2ca50;
      --gold-deep: #d4af37;
      --on-gold: #3c2f00;
      --outline: rgba(212, 175, 55, 0.2);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 32px 20px;
      line-height: 1.5;
      position: relative;
      overflow-x: hidden;
    }
    /* Subtle gold glow behind the card. */
    body::before {
      content: "";
      position: fixed;
      top: 50%; left: 50%;
      width: 600px; height: 600px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, rgba(10, 10, 10, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }
    main {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--outline);
      border-radius: 16px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 40px rgba(212, 175, 55, 0.04);
    }
    .brand {
      font-size: 13px; letter-spacing: 4px;
      color: var(--gold); text-transform: uppercase;
      font-weight: 700; margin-bottom: 14px;
    }
    .title {
      font-family: 'Playfair Display', serif;
      font-style: italic; font-weight: 700;
      font-size: 26px; line-height: 1.2;
      color: var(--text);
      margin: 0 0 10px;
    }
    .subtitle {
      color: var(--muted); font-size: 14px;
      margin: 0 0 24px;
    }
    .poster {
      width: 150px; height: 225px; border-radius: 10px;
      margin: 0 auto 22px; object-fit: cover;
      border: 1px solid var(--outline);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      display: none;
    }
    .poster.shown { display: block; }
    .cta {
      display: inline-flex; align-items: center; justify-content: center;
      width: 100%;
      padding: 14px 18px;
      background: var(--gold);
      color: var(--on-gold);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-decoration: none;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 10px;
      transition: box-shadow 150ms ease, transform 150ms ease;
    }
    .cta:hover { box-shadow: 0 0 25px rgba(212, 175, 55, 0.3); transform: translateY(-1px); }
    .cta.secondary {
      background: transparent;
      border: 1px solid var(--outline);
      color: var(--muted);
    }
    .cta.secondary:hover { border-color: var(--gold); color: var(--gold); box-shadow: none; }
    .footer {
      margin-top: 22px;
      font-size: 12px;
      color: rgba(208, 197, 175, 0.7);
      line-height: 1.6;
    }
    .footer a { color: var(--gold); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Fables</div>
    <h1 class="title" id="title">Open this title in Fables</h1>
    <p class="subtitle" id="subtitle">
      Detecting your device…
    </p>
    <img class="poster" id="poster" alt="" />
    <div id="actions"></div>
    <p class="footer">
      Fables is a personal media tracker for what you watch, read, and play.
      <br /><a href="https://tryfables.com/privacy/">Privacy</a>
    </p>
  </main>

  <script>
    const path = window.location.pathname.replace(/^\/+|\/+$/g, '').split('/');
    const segments = path[0] === 'fables' ? path.slice(1) : path;
    const params = new URLSearchParams(window.location.search);

    let titleName = params.get('name') || '';
    let posterUrl = params.get('poster') || '';
    let entityType = '';
    let category = '';
    let id = '';

    if (segments[0] === 'share' && segments[1] === 'title' && segments.length >= 4) {
      entityType = 'title';
      category = segments[2];
      id = segments[3];
    }

    const ua = navigator.userAgent || '';
    const isAndroid = /Android/i.test(ua);
    const isIOS = /iPad|iPhone|iPod/i.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');
    const posterEl = document.getElementById('poster');
    const actionsEl = document.getElementById('actions');

    if (titleName) {
      titleEl.textContent = `Open "${titleName}" in Fables`;
    }
    if (posterUrl) {
      // Posters arrive either as a full URL or as a bare TMDB path like
      // "/abc.jpg" (the app passes the raw poster_path). A bare path would
      // resolve against tryfables.com and 404, so prefix it with the TMDB
      // image CDN. Full URLs (http...) are left untouched.
      const resolvedPoster = /^\/[^/]/.test(posterUrl)
        ? 'https://image.tmdb.org/t/p/w500' + posterUrl
        : posterUrl;
      // If the image still fails to load, hide the slot rather than
      // showing a broken-image icon.
      posterEl.onerror = () => posterEl.classList.remove('shown');
      posterEl.src = resolvedPoster;
      posterEl.alt = titleName || 'Title poster';
      posterEl.classList.add('shown');
    }

    const ANDROID_TESTER_URL =
      'https://play.google.com/apps/testing/com.fables.app';

    if (isAndroid) {
      subtitleEl.textContent =
        'If you have Fables installed, it should open automatically. ' +
        'If not, join the Android closed test below.';
      actionsEl.innerHTML =
        `<a class="cta" href="${ANDROID_TESTER_URL}">Get Fables (Android)</a>` +
        `<a class="cta secondary" href="${ANDROID_TESTER_URL}">Open Play Store</a>`;
    } else if (isIOS) {
      subtitleEl.textContent =
        'Fables on iOS is launching soon. Try it on Android in the meantime.';
      actionsEl.innerHTML =
        `<a class="cta secondary" href="${ANDROID_TESTER_URL}">Get Fables on Android</a>`;
    } else {
      subtitleEl.textContent =
        'Open this link on your phone to install Fables.';
      actionsEl.innerHTML =
        `<a class="cta secondary" href="${ANDROID_TESTER_URL}">Android: tester opt-in</a>`;
    }
  </script>
</body>
</html>
